name: 同步 Notion 并发布放映室

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'   # 约每 15 分钟一次（GitHub 的定时任务可能晚几分钟）
  workflow_dispatch:        # 在 Actions 页面手动点"Run workflow"立即同步

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 从 Notion 同步片单和影评
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            msg="⚠️ 没读到 NOTION_TOKEN，这次没有同步，网站仍是旧快照。请到 Settings → Secrets and variables → Actions → **Secrets** 标签页（不是 Variables，也不是 Environments）→ Repository secrets，新建名为 NOTION_TOKEN 的密钥，然后重跑。"
            echo "::warning title=没有同步 Notion::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm install --no-save --no-audit --no-fund sharp@0.33 || echo "sharp 没装上，手动上传的剧照将不压缩"
          node scripts/sync.mjs
      - name: 提交同步结果
        id: commit
        run: |
          git config user.name "fangyingshi-bot"
          git config user.email "fangyingshi-bot@users.noreply.github.com"
          git add site/data.js site/posters site/posters-hd site/gallery data
          # 只有网页用到的内容变了才重新发布；定时任务里没变化就到此为止
          if git diff --cached --quiet -- site; then changed=false; else changed=true; fi
          git diff --cached --quiet || git commit -m "同步 Notion 片单 $(date -u +'%F %H:%M')"
          git push || true
          if [ "$changed" = true ] || [ "${{ github.event_name }}" != schedule ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
      - name: 组装完整页面（源文件是 Artifact 用的片段）
        if: steps.commit.outputs.deploy == 'true'
        run: |
          { printf '<!doctype html>\n<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">\n'; cat site/index.html; printf '\n</html>\n'; } > /tmp/index.html
          mv /tmp/index.html site/index.html
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.deploy == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
